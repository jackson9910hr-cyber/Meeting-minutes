<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>회의록 관리</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg:            #f4fbf8;
    --surface:       #ffffff;
    --surface-2:     rgba(255,255,255,0.92);
    --surface-3:     #f2f8f6;
    --border:        rgba(22,73,65,0.09);
    --border-strong: rgba(22,73,65,0.17);
    --text:          #173e39;
    --text-2:        #607a76;
    --text-3:        #94aaa6;
    --accent:        #16a085;
    --accent-btn:    #13977e;
    --accent-dim:    rgba(22,160,133,0.12);
    --accent-soft:   #dff7ef;
    --coral:         #ff7f6b;
    --coral-soft:    #fff0eb;
    --success:       #28a879;
    --danger:        #e96355;
    --shadow-sm:     0 6px 24px rgba(30,101,89,0.07);
    --shadow-md:     0 24px 60px rgba(22,73,65,0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    background:
      radial-gradient(circle at 8% 16%, rgba(133,224,196,0.23), transparent 26rem),
      radial-gradient(circle at 92% 8%, rgba(255,177,153,0.18), transparent 24rem),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.2px;
  }

  /* 헤더 */
  header {
    background: rgba(255,255,255,0.84);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 74px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 40px; height: 40px;
    border: none;
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.66rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
    background: linear-gradient(135deg, #22b99b, #0d8975);
    box-shadow: 0 8px 20px rgba(22,160,133,0.25);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.35; }
  .brand-name { font-size: 1rem; font-weight: 750; letter-spacing: -0.3px; color: var(--text); }
  .brand-sub  { font-size: 0.72rem; color: var(--text-3); letter-spacing: 0.2px; }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .header-meta {
    font-size: 0.76rem;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.2px;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

  /* 탭 */
  .tabs {
    background: rgba(255,255,255,0.84);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--border);
    padding: 0 40px;
    display: flex;
    gap: 6px;
    position: sticky;
    top: 74px;
    z-index: 90;
  }
  .tab-btn {
    padding: 0 4px;
    margin-right: 30px;
    height: 50px;
    background: none;
    border: none;
    color: var(--text-3);
    font-size: 0.86rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    font-family: inherit;
    display: flex; align-items: center; gap: 6px;
    letter-spacing: -0.1px;
  }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover:not(.active) { color: var(--text-2); }
  .tab-count { color: var(--text-3); font-weight: 650; background: var(--surface-3); padding: 2px 7px; border-radius: 999px; }
  .tab-btn.active .tab-count { color: var(--accent); }

  /* 레이아웃 */
  main { max-width: 960px; margin: 0 auto; padding: 54px 24px 88px; position: relative; }
  .panel { display: none; animation: fadeUp 0.25s ease; }
  .panel.active { display: block; }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .section-head { margin-bottom: 30px; }
  .section-kicker { display:inline-flex; align-items:center; gap:7px; color:var(--accent); font-size:.72rem; font-weight:750; letter-spacing:.12em; text-transform:uppercase; margin-bottom:10px; }
  .section-kicker::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 5px var(--coral-soft); }
  .section-title { font-size: 1.75rem; font-weight: 780; letter-spacing: -0.8px; color: var(--text); }
  .section-sub   { font-size: 0.88rem; color: var(--text-2); margin-top: 8px; line-height: 1.6; }

  /* 카드 */
  .card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px 32px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .card-label { display:flex; align-items:center; gap:10px;
    font-size: 0.86rem; font-weight: 720; color: var(--text);
    letter-spacing: -0.1px;
  }
  .card-label::before { content:''; width:9px; height:9px; border-radius:3px; background:linear-gradient(135deg,var(--accent),#6dd9bd); transform:rotate(45deg); }

  /* 폼 */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .form-group { display: flex; flex-direction: column; gap: 8px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.78rem; font-weight: 500; color: var(--text-2); letter-spacing: 0.1px; }
  .required::after { content: ' *'; color: var(--accent); }

  input[type="text"], input[type="date"], input[type="time"], textarea {
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 0.92rem;
    padding: 13px 15px;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
    resize: vertical;
    width: 100%;
    color-scheme: light;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }
  input::placeholder, textarea::placeholder { color: var(--text-3); }
  textarea { min-height: 96px; line-height: 1.65; }

  /* 버튼 */
  .btn {
    min-width: 92px;
    height: 40px;
    padding: 0 18px;
    border-radius: 11px;
    border: 1px solid transparent;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    white-space: nowrap;
    flex: 0 0 auto;
    letter-spacing: -0.1px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #20b497, var(--accent-btn));
    color: #ffffff;
    box-shadow: 0 8px 18px rgba(22,160,133,0.2);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 11px 24px rgba(22,160,133,0.28); }
  .btn-outline {
    background: rgba(255,255,255,.6);
    border-color: var(--border-strong);
    color: var(--text-2);
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .btn-text {
    background: transparent; border: none; color: var(--text-2);
    padding: 6px 4px; font-size: 0.85rem; font-weight: 500;
  }
  .btn-text:hover { color: var(--danger); }
  .btn-sm { min-width: 84px; height: 40px; padding: 0 14px; font-size: 0.82rem; }
  .form-actions {
    display: flex; gap: 10px; margin-top: 24px;
    justify-content: flex-end;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 820px) {
    .header-meta { display: none; }
  }

  /* 통계 */
  .stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface-2);
    padding: 24px 26px;
    border: 1px solid var(--border); border-radius:18px;
    box-shadow:var(--shadow-sm); position:relative; overflow:hidden;
  }
  .stat-card::after { content:''; position:absolute; width:64px; height:64px; right:-20px; top:-24px; border-radius:50%; background:var(--accent-soft); }
  .stat-card:nth-child(2)::after { background:#e5f7ff; }
  .stat-card:nth-child(3)::after { background:var(--coral-soft); }
  .stat-num {
    font-size: 1.8rem; font-weight: 760;
    color: var(--text);
    letter-spacing: -0.8px; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat-label { font-size: 0.76rem; color: var(--text-2); margin-top: 8px; letter-spacing: 0.1px; }

  /* 검색 */
  .search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-wrap { flex: 1; position: relative; }
  .search-wrap input { padding-left: 34px; }
  .search-ico { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 0.85rem; pointer-events: none; }

  /* 테이블 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  th {
    padding: 10px 14px;
    text-align: left;
    color: var(--text-3);
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
  }
  td {
    padding: 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text-2);
    line-height: 1.5;
  }
  .td-main { color: var(--text); font-weight: 500; }
  .td-ell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .td-no { color: var(--text-3); font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f0faf6; }
  .link-btn {
    background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--accent); font-size: 0.83rem; font-weight: 600; padding: 4px 0;
  }
  .link-btn:hover { opacity: 0.75; }
  .del-btn {
    background: none; border: none; font-family: inherit; cursor: pointer;
    color: var(--text-3); font-size: 0.95rem; padding: 4px 6px; line-height: 1;
  }
  .del-btn:hover { color: var(--danger); }

  /* 빈 상태 */
  .empty-state { text-align: center; padding: 64px 20px; }
  .empty-title { font-size: 0.9rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty-sub   { font-size: 0.8rem; color: var(--text-3); }

  /* 토스트 */
  #toast {
    position: fixed; bottom: 28px; right: 28px;
    padding: 13px 20px;
    border-radius: 14px;
    font-weight: 600; font-size: 0.85rem;
    opacity: 0; transform: translateY(10px);
    transition: all 0.22s ease;
    z-index: 999; pointer-events: none;
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border);
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok  { background: var(--surface-2); color: var(--success); border-color: rgba(111,174,130,0.3); }
  #toast.err { background: var(--surface-2); color: var(--danger);  border-color: rgba(217,122,108,0.3); }

  /* 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(18,55,50,0.45);
    backdrop-filter: blur(6px);
    z-index: 200; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 22px; padding: 32px;
    width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto;
    box-shadow: var(--shadow-md);
    animation: fadeUp 0.2s ease;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--border);
  }
  .modal-title { font-size: 1.02rem; font-weight: 600; color: var(--text); letter-spacing: -0.2px; }
  .modal-date  { font-size: 0.78rem; color: var(--text-3); margin-top: 5px; }
  .modal-field { margin-bottom: 18px; }
  .modal-field:last-child { margin-bottom: 0; }
  .modal-label { font-size: 0.7rem; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
  .modal-value {
    background: var(--surface-3); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px;
    font-size: 0.89rem; line-height: 1.7; white-space: pre-wrap; color: var(--text-2);
  }
  .modal-value.hl {
    border-left: 2px solid var(--accent);
    color: var(--text);
  }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: 1fr; }
    header       { padding: 0 16px; }
    .brand-text  { display: none; }
    .tabs        { padding: 0 18px; }
    main         { padding: 32px 16px 64px; }
    .card        { padding: 20px 18px; }
    .header-right { gap: 8px; }
    .header-meta { display: none; }
    .header-actions .btn { min-width: 78px; padding: 0 11px; }
    .tab-btn     { margin-right: 20px; font-size: 0.82rem; }
    .search-bar  { flex-direction: column; }
    .search-bar .btn { width: 100%; }
    .form-actions .btn { flex: 1 1 0; min-width: 0; }
    .modal-header { gap: 14px; }
    .modal-header .btn { min-width: 72px; }
  }

  @media (max-width: 380px) {
    header { padding-inline: 12px; }
    .brand-mark { width: 36px; height: 36px; border-radius: 11px; }
    .header-actions { gap: 6px; }
    .header-actions .btn { min-width: 72px; padding-inline: 9px; font-size: 0.76rem; }
    .tabs { overflow-x: auto; }
    .tab-btn { flex: 0 0 auto; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">MM</div>
    <div class="brand-text">
      <span class="brand-name">회의록 관리</span>
      <span class="brand-sub">Meeting Minutes Workspace</span>
    </div>
  </div>
  <div class="header-right">
    <span class="header-meta" id="header-date"></span>
    <div class="header-actions">
      <button type="button" class="btn btn-outline btn-sm" onclick="importExcel()">불러오기</button>
      <button type="button" class="btn btn-primary btn-sm" onclick="exportExcel()">Excel 저장</button>
    </div>
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none" onchange="handleFileImport(event)"/>
  </div>
</header>

<div class="tabs">
  <button type="button" class="tab-btn active" onclick="window.location.reload()">새 회의록 작성</button>
  <button type="button" class="tab-btn" onclick="switchTab('history', this)">
    이력 조회 <span class="tab-count" id="tab-count">0</span>
  </button>
</div>

<main>

  <!-- 작성 탭 -->
  <div class="panel active" id="panel-write">
    <div class="section-head">
      <div class="section-kicker">Smart workspace</div>
      <div class="section-title">새 회의록 작성</div>
      <div class="section-sub">저장하면 브라우저에 자동 누적됩니다 · 중요 내용은 Excel 저장으로 백업하세요</div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-label">기본 정보</span>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label class="required">날짜</label>
          <input type="date" id="f-date"/>
        </div>
        <div class="form-group">
          <label>시간</label>
          <input type="time" id="f-time"/>
        </div>
        <div class="form-group full">
          <label class="required">안건 / 주제</label>
          <input type="text" id="f-agenda" placeholder="회의 안건 또는 주제를 입력하세요"/>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-label">회의 내용</span>
      </div>
      <div class="form-grid">
        <div class="form-group full">
          <label>회의 내용 (세부)</label>
          <textarea id="f-content" placeholder="회의에서 논의된 세부 내용을 자유롭게 입력하세요" style="min-height:120px"></textarea>
        </div>
        <div class="form-group full">
          <label>결정사항 / 액션아이템</label>
          <textarea id="f-action" placeholder="결정된 사항, 담당자별 액션아이템, 다음 회의 일정 등을 입력하세요"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="clearForm()">초기화</button>
        <button class="btn btn-primary" onclick="saveMeeting()">저장하기</button>
      </div>
    </div>
  </div>

  <!-- 이력 탭 -->
  <div class="panel" id="panel-history">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-label">전체 회의록</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-month">0</div>
        <div class="stat-label">이번 달</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-recent" style="font-size:1.05rem">—</div>
        <div class="stat-label">최근 회의일</div>
      </div>
    </div>

    <div class="card" style="padding:24px 26px">
      <div class="search-bar">
        <div class="search-wrap">
          <span class="search-ico">⌕</span>
          <input type="text" id="search-input" placeholder="안건, 회의내용, 결정사항 검색..." oninput="renderTable()"/>
        </div>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('search-input').value='';renderTable()">초기화</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:40px">No</th>
              <th>날짜</th>
              <th>시간</th>
              <th>안건 / 주제</th>
              <th>결정사항</th>
              <th style="width:56px">상세</th>
              <th style="width:40px"></th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="empty-state" class="empty-state" style="display:none">
        <div class="empty-title">저장된 회의록이 없습니다</div>
        <div class="empty-sub">회의록 작성 탭에서 새 회의록을 추가해 보세요</div>
      </div>
    </div>
  </div>

</main>

<!-- 모달 -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-date"  id="modal-date"></div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('modal').classList.remove('show')">닫기</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
  let meetings = [];

  function init() {
    loadData();
    clearForm();
    updateTabCount();
    updateHeaderDate();
    setInterval(updateHeaderDate, 30000);
  }

  function updateHeaderDate() {
    const now = new Date();
    document.getElementById('header-date').textContent =
      now.toLocaleDateString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit'}) + '  ' +
      now.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'});
  }

  function loadData() {
    try { meetings = JSON.parse(localStorage.getItem('meeting_minutes') || '[]'); }
    catch(e) { meetings = []; }
  }
  function saveData() { localStorage.setItem('meeting_minutes', JSON.stringify(meetings)); }

  function switchTab(tab, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    el.classList.add('active');
    if (tab === 'history') { updateStats(); renderTable(); }
  }

  function updateTabCount() {
    document.getElementById('tab-count').textContent = meetings.length;
  }

  function saveMeeting() {
    const date    = document.getElementById('f-date').value;
    const time    = document.getElementById('f-time').value;
    const agenda  = document.getElementById('f-agenda').value.trim();
    const content = document.getElementById('f-content').value.trim();
    const action  = document.getElementById('f-action').value.trim();
    if (!date || !agenda) { showToast('날짜와 안건은 필수 항목입니다', 'err'); return; }
    meetings.unshift({ id: Date.now(), date, time, agenda, content, action, createdAt: new Date().toISOString() });
    saveData();
    updateTabCount();
    clearForm();
    showToast('회의록이 저장되었습니다', 'ok');
  }

  function clearForm() {
    ['f-agenda','f-content','f-action'].forEach(id => document.getElementById(id).value = '');
    const now = new Date();
    document.getElementById('f-date').value = now.toISOString().split('T')[0];
    document.getElementById('f-time').value = now.toTimeString().slice(0,5);
  }

  function renderTable() {
    const kw = document.getElementById('search-input').value.toLowerCase();
    const filtered = meetings.filter(m =>
      m.agenda.toLowerCase().includes(kw) ||
      (m.content||'').toLowerCase().includes(kw) ||
      (m.action||'').toLowerCase().includes(kw)
    );
    const tbody = document.getElementById('table-body');
    const empty = document.getElementById('empty-state');
    if (filtered.length === 0) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    tbody.innerHTML = filtered.map((m,i) => `
      <tr>
        <td class="td-no">${filtered.length - i}</td>
        <td style="font-size:0.83rem">${m.date}</td>
        <td style="font-size:0.83rem;color:var(--text-3)">${m.time||'—'}</td>
        <td class="td-main td-ell">${m.agenda}</td>
        <td class="td-ell">${m.action||'—'}</td>
        <td><button class="link-btn" onclick="showDetail(${m.id})">보기</button></td>
        <td><button class="del-btn" onclick="deleteMeeting(${m.id})">✕</button></td>
      </tr>
    `).join('');
  }

  function updateStats() {
    const now = new Date();
    const ym  = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    document.getElementById('stat-total').textContent  = meetings.length;
    document.getElementById('stat-month').textContent  = meetings.filter(m => m.date.startsWith(ym)).length;
    document.getElementById('stat-recent').textContent = meetings.length > 0 ? meetings[0].date : '—';
  }

  function showDetail(id) {
    const m = meetings.find(x => x.id === id);
    if (!m) return;
    document.getElementById('modal-title').textContent = m.agenda;
    document.getElementById('modal-date').textContent  = `${m.date}  ${m.time||''}`;
    document.getElementById('modal-content').innerHTML = `
      <div class="modal-field">
        <div class="modal-label">안건 / 주제</div>
        <div class="modal-value hl">${m.agenda}</div>
      </div>
      <div class="modal-field">
        <div class="modal-label">회의 내용 (세부)</div>
        <div class="modal-value">${m.content||'내용 없음'}</div>
      </div>
      <div class="modal-field">
        <div class="modal-label">결정사항 / 액션아이템</div>
        <div class="modal-value">${m.action||'내용 없음'}</div>
      </div>
    `;
    document.getElementById('modal').classList.add('show');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal'))
      document.getElementById('modal').classList.remove('show');
  }

  function deleteMeeting(id) {
    if (!confirm('이 회의록을 삭제하시겠습니까?')) return;
    meetings = meetings.filter(m => m.id !== id);
    saveData(); updateTabCount(); updateStats(); renderTable();
    showToast('삭제되었습니다', 'err');
  }

  function exportExcel() {
    if (meetings.length === 0) { showToast('저장된 회의록이 없습니다', 'err'); return; }
    if (typeof XLSX === 'undefined') { showToast('라이브러리 로딩 중입니다', 'err'); return; }
    const data = [...meetings].reverse().map((m,i) => ({
      'No'                  : i+1,
      '날짜'                : m.date,
      '시간'                : m.time||'',
      '안건/주제'           : m.agenda,
      '회의내용(세부)'      : m.content||'',
      '결정사항/액션아이템' : m.action||'',
      '작성일시'            : new Date(m.createdAt).toLocaleString('ko-KR')
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{wch:5},{wch:12},{wch:8},{wch:32},{wch:44},{wch:44},{wch:22}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '회의록');
    XLSX.writeFile(wb, '회의록.xlsx');
    showToast('회의록.xlsx 저장 완료', 'ok');
  }

  function importExcel() { document.getElementById('fileInput').click(); }

  function handleFileImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const wb   = XLSX.read(e.target.result, { type:'binary' });
        const ws   = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws);
        const imported = rows.map(row => ({
          id: Date.now() + Math.random(),
          date: String(row['날짜']||''), time: String(row['시간']||''),
          agenda: row['안건/주제']||'', content: row['회의내용(세부)']||'',
          action: row['결정사항/액션아이템']||'',
          createdAt: row['작성일시']||new Date().toISOString()
        }));
        const keys = new Set(meetings.map(m => m.date+'|'+m.agenda));
        const newItems = imported.filter(m => !keys.has(m.date+'|'+m.agenda));
        meetings = [...newItems, ...meetings];
        meetings.sort((a,b) => new Date(b.date) - new Date(a.date));
        saveData(); updateTabCount();
        showToast(`${newItems.length}건 불러왔습니다`, 'ok');
      } catch(err) { showToast('파일 읽기 오류', 'err'); }
    };
    reader.readAsBinaryString(file);
    event.target.value = '';
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = (type==='ok' ? '✓  ' : '✕  ') + msg;
    t.className = `show ${type}`;
    clearTimeout(t._t);
    t._t = setTimeout(() => t.className = '', 2800);
  }

  init();
</script>

</body>
</html>
